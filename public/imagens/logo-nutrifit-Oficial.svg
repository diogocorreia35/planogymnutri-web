<svg viewBox="0 0 480 160" width="240" height="80" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mark-bg { fill: #1B4332; }
      .mark-leaf { fill: #FF6B35; }
      .wordmark { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; fill: #1B4332; }
      .wordmark-accent { fill: #FF6B35; }
      .tagline { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 500; letter-spacing: 1.5px; fill: #52796F; }
    </style>
  </defs>

  <!-- Icon: circular badge -->
  <circle cx="80" cy="80" r="64" class="mark-bg" />

  <!-- Dumbbell shape (fitness) -->
  <g>
    <rect x="44" y="74" width="72" height="12" rx="4" fill="#FFFFFF" />
    <rect x="36" y="64" width="14" height="32" rx="4" fill="#FFFFFF" />
    <rect x="110" y="64" width="14" height="32" rx="4" fill="#FFFFFF" />
  </g>

  <!-- Leaf (nutrition), growing out of the bar's midpoint -->
  <path d="M80 74
           C 68 58, 68 38, 86 28
           C 96 46, 92 64, 80 74 Z"
        class="mark-leaf" />
  <path d="M80 72 C 78 60, 80 46, 86 32" stroke="#1B4332" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Wordmark -->
  <text x="172" y="82" font-size="52" class="wordmark">Nutri<tspan class="wordmark-accent">Fit</tspan></text>
  <text x="174" y="110" font-size="16" class="tagline">EXERCÍCIO · NUTRIÇÃO · PLANOS</text>
</svg>
